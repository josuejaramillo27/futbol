<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080B0A">
    <title>Mis Grupos | CHALACAPP</title>
    
    <link rel="icon" type="image/png" href="logo-chalacapp-nav.png">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
    
    <style>
        /* FONDO CORREGIDO: Se eliminó el background negro para que herede la imagen de styles.css */
        body { min-height: 100vh; display: flex; flex-direction: column; margin: 0; padding: 0; font-family: inherit; color: #fff; }
        
        .topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(8, 11, 10, 0.95); border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; z-index: 100; }
        .topbar-nav { display: flex; gap: 15px; align-items: center; }
        .topbar-nav a { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #aaa; transition: color 0.3s; font-size: 0.6rem; font-weight: bold; gap: 3px; }
        .topbar-nav a.active { color: var(--primary-green); }
        .topbar-nav i { font-size: 1.2rem; }

        .container { max-width: 900px; margin: 0 auto; padding: 25px 20px 80px; width: 100%; box-sizing: border-box; }
        
        /* OVERRIDES: EVITAR BOTONES CORTADOS Y LUCES EXCESIVAS */
        .btn { transition: background 0.2s, color 0.2s, opacity 0.2s !important; }
        .btn:hover { transform: none !important; box-shadow: none !important; opacity: 0.85; }
        
        /* TARJETAS DE GRUPOS */
        .grupos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .grupo-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; cursor: pointer; transition: background 0.2s, border-color 0.2s; position: relative; backdrop-filter: blur(10px); }
        .grupo-card:hover { border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.04); }
        .grupo-card-title { font-size: 1.4rem; margin: 0 0 5px; color: #fff; }
        .grupo-card-sport { display: inline-block; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; color: #ccc; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.15); }
        
        /* TABS VESTUARIO */
        .tabs-container { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .tab-btn { background: transparent; border: 1px solid transparent; color: #888; font-size: 0.95rem; font-weight: 700; cursor: pointer; padding: 8px 18px; border-radius: 8px; transition: background 0.2s, color 0.2s; white-space: nowrap; }
        .tab-btn:hover { color: #fff !important; background: rgba(255, 255, 255, 0.05) !important; transform: none !important; }
        .tab-btn.active { color: #fff !important; background: rgba(255, 255, 255, 0.1) !important; border: 1px solid rgba(255, 255, 255, 0.2) !important; }

        /* LISTAS DE TARJETAS */
        .friend-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .friend-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(10px); }
        .friend-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .friend-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #555; }
        .friend-name { font-weight: bold; font-size: 1rem; color: #fff; margin: 0 0 2px; }

        .search-box { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
        .search-input { flex: 1; padding: 12px 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; min-width: 0; box-sizing: border-box
