<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080B0A">
    <title>Mis Grupos | CHALACAPP</title>
    
    <link rel="icon" type="image/png" href="logo-chalacapp-nav.png">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
    
    <style>
        body { background: #080B0A; min-height: 100vh; display: flex; flex-direction: column; margin: 0; padding: 0; font-family: inherit; color: #fff; }
        
        .topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(8, 11, 10, 0.95); border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; z-index: 100; }
        .topbar-nav { display: flex; gap: 15px; align-items: center; }
        .topbar-nav a { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #aaa; transition: color 0.3s; font-size: 0.6rem; font-weight: bold; gap: 3px; }
        .topbar-nav a.active { color: var(--primary-green); }
        .topbar-nav i { font-size: 1.2rem; }

        .container { max-width: 900px; margin: 0 auto; padding: 25px 20px 80px; width: 100%; box-sizing: border-box; }
        
        /* TARJETAS DE GRUPOS */
        .grupos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .grupo-card { background: linear-gradient(135deg, rgba(20,25,22,0.9) 0%, rgba(10,15,12,0.9) 100%); border: 1px solid rgba(46, 204, 113, 0.3); border-radius: 16px; padding: 20px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative; overflow: hidden; }
        .grupo-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(46, 204, 113, 0.2); }
        .grupo-card-title { font-size: 1.4rem; margin: 0 0 5px; color: #fff; }
        .grupo-card-sport { display: inline-block; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; color: #ccc; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.2); }
        
        /* TABS VESTUARIO (CORREGIDO EL HOVER PARA MEJOR CONTRASTE) */
        .tabs-container { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; flex-wrap: nowrap; overflow-x: auto; }
        .tab-btn { background: transparent; border: 1px solid transparent; color: #888; font-size: 0.95rem; font-weight: 700; cursor: pointer; padding: 8px 18px; border-radius: 8px; transition: all 0.3s ease; white-space: nowrap; }
        .tab-btn:hover { color: var(--primary-green) !important; background: rgba(46, 204, 113, 0.08) !important; border: 1px solid rgba(46, 204, 113, 0.3); }
        .tab-btn.active { color: var(--primary-green) !important; background: rgba(46, 204, 113, 0.12) !important; border: 1px solid rgba(46, 204, 113, 0.3); }

        /* LISTAS DE TARJETAS */
        .friend-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .friend-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; }
        .friend-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .friend-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #555; }
        .friend-name { font-weight: bold; font-size: 1rem; color: #fff; margin: 0 0 2px; }
        
        /* BUSCADOR */
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
        .search-input { flex: 1; padding: 12px 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; min-width: 0; box-sizing: border-box; }
        
        /* BOTÓN FLOTANTE */
        .fab-convocar { position: fixed; bottom: 85px; right: 20px; background: linear-gradient(45deg, #f1c40f, #e67e22); color: #000; border: none; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; box-shadow: 0 5px 20px rgba(241,196,15,0.4); cursor: pointer; z-index: 100; transition: transform 0.2s; }
        .fab-convocar:hover { transform: scale(1.1); }

        /* CANCHAS DINÁMICAS (RANKING) */
        .soccer-pitch { position: relative; background: repeating-linear-gradient(0deg, #1b4924, #1b4924 10%, #153c1d 10%, #153c1d 20%); border: 2px solid rgba(255,255,255,0.4); border-radius: 12px; padding: 15px 10px; display: flex; flex-direction: column; justify-content: space-around; height: 480px; overflow: hidden; margin-top: 15px; box-shadow: inset 0 0 30px rgba(0,0,0,0.6); }
        .pitch-line { position: absolute; border: 2px solid rgba(255,255,255,0.3); pointer-events: none; }
        .pitch-center { top: 50%; left: 0; width: 100%; height: 0; }
        .pitch-circle { top: 50%; left: 50%; width: 100px; height: 100px; border-radius: 50%; transform: translate(-50%, -50%); }
        
        .voley-pitch { position: relative; background: #2980b9; border: 3px solid #f1c40f; border-radius: 8px; padding: 15px 10px; display: flex; flex-direction: column; justify-content: space-around; height: 440px; overflow: hidden; margin-top: 15px; }
        .voley-line { position: absolute; background: #f1c40f; pointer-events: none; }
        .voley-center { top: 50%; left: 0; width: 100%; height: 4px; transform: translateY(-50%); }

        .basket-pitch { position: relative; background: #d35400; border: 2px solid #fff; border-radius: 8px; padding: 15px 10px; display: flex; flex-direction: column; justify-content: space-around; height: 480px; overflow: hidden; margin-top: 15px; }
        .basket-line { position: absolute; border: 2px solid #fff; pointer-events: none; }
        .basket-center { top: 50%; left: 0; width: 100%; height: 0; }
        .basket-circle { top: 50%; left: 50%; width: 80px; height: 80px; border-radius: 50%; transform: translate(-50%, -50%); }

        .formation-row { display: flex; justify-content: center; gap: 15px; z-index: 10; position: relative; min-height: 70px; flex-wrap: wrap; align-items: center; }
        .player-pitch-card { display: flex; flex-direction: column; align-items: center; transition: transform 0.3s ease; position: relative; cursor: pointer; }
        .player-pitch-photo-container { position: relative; width: 55px; height: 65px; display: flex; justify-content: center; }
        .player-pitch-card img { width: 100%; height: 100%; object-fit: cover; border-top-left-radius: 10px; border-top-right-radius: 10px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; border: 2px solid #f1c40f; background: #111; box-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        .player-pitch-score { position: absolute; top: -5px; right: -8px; background: #f1c40f; color: #000; border-radius: 50%; width: 22px; height: 22px; font-size: 0.65rem; display: flex; align-items: center; justify-content: center; font-weight: 900; border: 2px solid #111; }
        .player-pitch-name { background: rgba(0,0,0,0.85); color: #fff; font-size: 0.65rem; padding: 3px 8px; border-radius: 4px; margin-top: -10px; font-weight: bold; text-transform: uppercase; white-space: nowrap; max-width: 70px; overflow: hidden; text-overflow: ellipsis; border: 1px solid rgba(255,255,255,0.2); z-index: 2; }
    </style>
</head>
<body>

<header class="topbar">
    <a class="brand" href="index.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
        <img src="logo-chalacapp-nav.png" alt="Logo" style="height: 28px;">
        <span style="font-size: 1.2rem; letter-spacing: 1px; color: #fff; font-weight: 900;">CHALACAPP</span>
    </a>
    <nav class="topbar-nav">
        <a href="index.html"><i class="ph-bold ph-map-pin"></i> CANCHAS</a>
        <a href="jugadores.html"><i class="ph-bold ph-users"></i> BOLSA</a>
        <a href="amigos.html" class="active"><i class="ph-bold ph-address-book"></i> GRUPOS</a>
        <a href="comunidades.html"><i class="ph-bold ph-shield-checkered"></i> LIGAS</a>
    </nav>
</header>

<main class="container">

    <div id="vista-lobby-grupos">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h1 style="margin: 0; font-size: 1.8rem; color: #fff;">Mis Grupos</h1>
                <p style="margin: 4px 0 0 0; color: var(--text-muted); font-size: 0.9rem;">Organiza a tus amigos por deporte (Máx. 3).</p>
            </div>
            <button id="btn-crear-grupo" class="btn" style="width: auto !important; padding: 10px 18px; background:var(--primary-green); color:#000; font-weight:bold; border:none; border-radius:8px; display:inline-flex; align-items:center; gap:6px;"><i class="ph-bold ph-plus"></i> Crear Grupo</button>
        </div>

        <div id="lista-mis-grupos" class="grupos-grid">
            <p style="color:#aaa; text-align:center; grid-column:1/-1;"><i class="ph-bold ph-spinner-gap ph-spin"></i> Cargando tus grupos...</p>
        </div>
    </div>


    <div id="vista-vestuario-grupo" style="display: none;">
        
        <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 15px; justify-content: flex-start;">
            <button id="btn-volver-lobby" class="btn" style="width: auto !important; background:transparent; border:1px solid rgba(255,255,255,0.2); color:#fff; padding:8px 14px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;"><i class="ph-bold ph-arrow-left" style="font-size:1.2rem;"></i></button>
            <div style="text-align: left;">
                <h1 id="vestuario-nombre" style="margin: 0; font-size: 1.6rem; color: #fff; line-height: 1.2;">...</h1>
                <span id="vestuario-deporte" style="color: var(--primary-green); font-size: 0.8rem; font-weight: bold; background: rgba(46, 204, 113, 0.1); padding: 2px 8px; border-radius: 4px; display:inline-block; margin-top:4px;">...</span>
            </div>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" id="tab-miembros">Miembros</button>
            <button class="tab-btn" id="tab-explorar">Buscar Jugadores</button>
            <button class="tab-btn" id="tab-ranking"><i class="ph-fill ph-star" style="color:#f1c40f;"></i> El 11 Ideal</button>
        </div>

        <div id="seccion-miembros">
            <div id="lista-amigos-grupo" class="friend-list"></div>
            <button class="fab-convocar" id="btn-abrir-convocatoria" title="Armar Partido"><i class="ph-bold ph-megaphone"></i></button>
        </div>

        <div id="seccion-explorar" style="display: none;">
            
            <div class="search-box">
                <input type="text" id="input-buscar-jugador" class="search-input" placeholder="Buscar jugador globalmente...">
                <button id="btn-buscar-jugador" class="btn" style="width: auto !important; background:var(--primary-green); color:#000; padding: 0 20px; border-radius: 10px; display:inline-flex; align-items:center; justify-content:center; flex-shrink: 0;"><i class="ph-bold ph-magnifying-glass" style="font-size: 1.2rem;"></i></button>
            </div>
            
            <div id="lista-busqueda" class="friend-list">
                <p style="color:#aaa; text-align:center; grid-column:1/-1; padding: 20px;">Busca jugadores para añadirlos directamente a este grupo.</p>
            </div>
        </div>

        <div id="seccion-ranking" style="display: none;">
            <p style="color:var(--text-muted); font-size:0.9rem; text-align:center; margin-bottom:20px;">Basado en las estadísticas de los miembros de este grupo.</p>
            <div id="contenedor-cancha-ranking"></div>
        </div>
    </div>

</main>

<div id="modal-crear-grupo" class="modal-oculto" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; align-items:center; justify-content:center; padding:20px; box-sizing:border-box;">
    <div class="modal-contenido" style="background:#111; padding:30px 25px; border-radius:16px; width:100%; max-width:400px; position:relative; border:1px solid var(--primary-green); box-shadow:0 10px 30px rgba(0,0,0,0.8);">
        
        <button id="cerrar-crear-grupo" style="position:absolute; top:15px; right:15px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#aaa; font-size:1.2rem; cursor:pointer; width:35px; height:35px; border-radius:50%; display:flex; align-items:center; justify-content:center; padding:0; transition:all 0.3s;"><i class="ph-bold ph-x"></i></button>
        
        <h2 style="margin-top:0; color:#fff;">Nuevo Grupo</h2>
        <form id="form-crear-grupo">
            <input type="text" id="cg-nombre" required placeholder="Nombre (ej. Los del Barrio)" maxlength="30" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2); border-radius:8px; color:#fff; margin-bottom:15px; box-sizing:border-box;">
            
            <label style="color:#aaa; font-size:0.85rem; margin-bottom:8px; display:block;">Selecciona el deporte principal:</label>
            <select id="cg-deporte" required style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2); border-radius:8px; color:#fff; margin-bottom:25px; box-sizing:border-box;">
                <option value="Fútbol">Fútbol</option>
                <option value="Vóley">Vóley</option>
                <option value="Básquet">Básquet</option>
                <option value="Otros">Otros</option>
            </select>

            <button type="submit" class="btn" style="width:100%; background:var(--primary-green); color:#000; font-weight:bold; border:none;">Crear Vestuario</button>
        </form>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, doc, getDoc, updateDoc, setDoc, serverTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyBqZSb3ZkI1QqoLGyP47ckD7eexwdStdXk", authDomain: "app-futbol-acd0f.firebaseapp.com", projectId: "app-futbol-acd0f", storageBucket: "app-futbol-acd0f.firebasestorage.app", messagingSenderId: "223446110165", appId: "1:223446110165:web:219afce6a9dac03203f75c" };
    const app = initializeApp(firebaseConfig), db = getFirestore(app), auth = getAuth(app);

    let currentUser = null;
    let misGrupos = [];
    let grupoActivo = null; 
    let miembrosDataGrupoActivo = [];

    window.toast = function(msg) { alert(msg); };

    // TABS DEL VESTUARIO
    const tabs = { mbr: document.getElementById('tab-miembros'), exp: document.getElementById('tab-explorar'), rnk: document.getElementById('tab-ranking') };
    const secs = { mbr: document.getElementById('seccion-miembros'), exp: document.getElementById('seccion-explorar'), rnk: document.getElementById('seccion-ranking') };

    function switchTab(tabKey) {
        Object.values(tabs).forEach(t => t.classList.remove('active'));
        Object.values(secs).forEach(s => s.style.display = 'none');
        tabs[tabKey].classList.add('active'); secs[tabKey].style.display = 'block';
        if(tabKey === 'rnk') dibujarEquipoIdeal(grupoActivo.deporte);
    }
    tabs.mbr.onclick = () => switchTab('mbr'); tabs.exp.onclick = () => switchTab('exp'); tabs.rnk.onclick = () => switchTab('rnk');

    // INIT
    onAuthStateChanged(auth, async (u) => {
        if(!u) { window.location.href = 'login.html'; return; }
        currentUser = u;
        cargarMisGrupos();
    });

    // =====================================
    // LÓGICA DE GRUPOS (LOBBY)
    // =====================================
    async function cargarMisGrupos() {
        const lista = document.getElementById('lista-mis-grupos');
        lista.innerHTML = '<p style="color:#aaa; text-align:center; grid-column:1/-1;">Cargando...</p>';
        try {
            const q = query(collection(db, 'grupos_amigos'), where('ownerUid', '==', currentUser.uid));
            const snap = await getDocs(q);
            misGrupos = snap.docs.map(d => ({ id: d.id, ...d.data() }));

            document.getElementById('btn-crear-grupo').style.display = misGrupos.length >= 3 ? 'none' : 'inline-flex';

            if(misGrupos.length === 0) {
                lista.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding:40px 20px; background:rgba(255,255,255,0.02); border:1px dashed #555; border-radius:16px;">
                        <i class="ph-bold ph-users-three" style="font-size:3rem; color:#666; margin-bottom:10px;"></i>
                        <h3 style="margin:0 0 10px; color:#fff;">No tienes grupos aún</h3>
                        <p style="color:#aaa; font-size:0.9rem; margin-bottom:20px;">Crea tu primer vestuario para organizar a tus amigos según el deporte que juegan.</p>
                        <button onclick="document.getElementById('modal-crear-grupo').style.display='flex';" class="btn" style="width:auto !important; background:var(--primary-green); color:#000; border:none; padding: 10px 20px;">Crear mi primer Grupo</button>
                    </div>`;
                return;
            }

            lista.innerHTML = misGrupos.map(g => `
                <div class="grupo-card" onclick="abrirVestuario('${g.id}')">
                    <span class="grupo-card-sport">${g.deporte}</span>
                    <h3 class="grupo-card-title">${g.nombre}</h3>
                    <p style="color:#888; font-size:0.85rem; margin:0;"><i class="ph-fill ph-users"></i> ${g.miembros_uids ? g.miembros_uids.length : 0} Jugadores</p>
                </div>
            `).join('');

        } catch(e) { lista.innerHTML = '<p style="color:red; text-align:center;">Error al cargar grupos.</p>'; }
    }

    // CREAR GRUPO
    document.getElementById('btn-crear-grupo').onclick = () => document.getElementById('modal-crear-grupo').style.display='flex';
    document.getElementById('cerrar-crear-grupo').onclick = () => document.getElementById('modal-crear-grupo').style.display='none';
    
    document.getElementById('form-crear-grupo').onsubmit = async (e) => {
        e.preventDefault();
        if(misGrupos.length >= 3) { window.toast("Ya alcanzaste el máximo de 3 grupos."); return; }
        
        const btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true; btn.innerHTML = 'Creando...';
        try {
            await addDoc(collection(db, 'grupos_amigos'), {
                ownerUid: currentUser.uid,
                nombre: document.getElementById('cg-nombre').value.trim(),
                deporte: document.getElementById('cg-deporte').value,
                miembros_uids: [], // Nace vacío
                createdAt: serverTimestamp()
            });
            window.toast("¡Grupo creado!");
            document.getElementById('modal-crear-grupo').style.display='none';
            e.target.reset();
            cargarMisGrupos();
        } catch(err) { window.toast("Error."); } finally { btn.disabled = false; btn.innerHTML = 'Crear Vestuario'; }
    };

    // =====================================
    // DENTRO DEL VESTUARIO
    // =====================================
    document.getElementById('btn-volver-lobby').onclick = () => {
        document.getElementById('vista-vestuario-grupo').style.display = 'none';
        document.getElementById('vista-lobby-grupos').style.display = 'block';
        grupoActivo = null;
        cargarMisGrupos(); 
    };

    window.abrirVestuario = async function(grupoId) {
        grupoActivo = misGrupos.find(g => g.id === grupoId);
        if(!grupoActivo) return;

        document.getElementById('vista-lobby-grupos').style.display = 'none';
        document.getElementById('vista-vestuario-grupo').style.display = 'block';
        
        document.getElementById('vestuario-nombre').textContent = grupoActivo.nombre;
        document.getElementById('vestuario-deporte').textContent = grupoActivo.deporte;

        switchTab('mbr');
        await cargarMiembrosDelGrupo();
    };

    async function cargarMiembrosDelGrupo() {
        const lista = document.getElementById('lista-amigos-grupo');
        const uids = grupoActivo.miembros_uids || [];
        
        if (uids.length === 0) {
            lista.innerHTML = '<p style="color:#aaa; text-align:center; grid-column:1/-1; padding:30px;">Vestuario vacío. Ve a "Buscar Jugadores" para añadir a tu equipo.</p>';
            miembrosDataGrupoActivo = [];
            return;
        }
        
        lista.innerHTML = '<div style="text-align:center; grid-column:1/-1;"><i class="ph-bold ph-spinner-gap ph-spin"></i> Cargando alineación...</div>';
        try {
            miembrosDataGrupoActivo = [];
            const chunks = []; for(let i=0; i<uids.length; i+=10) chunks.push(uids.slice(i, i+10));
            
            for(let chunk of chunks) {
                const q = query(collection(db, 'jugadores_perfiles'), where('__name__', 'in', chunk));
                const snap = await getDocs(q);
                snap.forEach(d => miembrosDataGrupoActivo.push({ uid: d.id, ...d.data() }));
            }
            
            lista.innerHTML = miembrosDataGrupoActivo.map(j => `
                <div class="friend-card">
                    <div class="friend-info">
                        <img src="${j.foto || 'https://via.placeholder.com/50'}" class="friend-avatar">
                        <div>
                            <h4 class="friend-name">${j.nombre || 'Jugador'}</h4>
                            <span style="font-size: 0.75rem; color: #f1c40f; background: rgba(241,196,15,0.1); padding: 2px 6px; border-radius: 4px;">${j.posicion || 'JUG'}</span>
                        </div>
                    </div>
                    <button class="btn" style="width: auto !important; background:rgba(231,76,60,0.1); color:#e74c3c; border:none; padding:8px; border-radius:8px; display:flex; align-items:center;" onclick="quitarDelGrupo('${j.uid}')" title="Quitar del grupo"><i class="ph-bold ph-trash"></i></button>
                </div>
            `).join('');

        } catch(e) { lista.innerHTML = '<p style="color:red; text-align:center; grid-column:1/-1;">Error al cargar miembros.</p>'; }
    }

    // BUSCAR Y AGREGAR DIRECTO AL GRUPO
    document.getElementById('btn-buscar-jugador').onclick = async () => {
        const qTexto = document.getElementById('input-buscar-jugador').value.trim().toLowerCase();
        if(!qTexto) return;
        const lista = document.getElementById('lista-busqueda');
        lista.innerHTML = '<p style="text-align:center; grid-column:1/-1;">Buscando...</p>';
        try {
            const snap = await getDocs(collection(db, 'jugadores_perfiles'));
            let html = '';
            snap.forEach(d => {
                const j = d.data();
                if(d.id === currentUser.uid) return; 
                const match = (j.nombre||'').toLowerCase().includes(qTexto) || (j.apodo||'').toLowerCase().includes(qTexto);
                if(match) {
                    const yaEsta = grupoActivo.miembros_uids && grupoActivo.miembros_uids.includes(d.id);
                    const btnHtml = yaEsta 
                        ? `<button class="btn" style="width: auto !important; padding:6px 12px; font-size:0.75rem; background:transparent; border:1px solid #aaa; color:#aaa;" disabled><i class="ph-bold ph-check"></i> En grupo</button>` 
                        : `<button class="btn" style="width: auto !important; padding:6px 12px; font-size:0.75rem; background:var(--primary-green); color:#000; border:none; font-weight:bold;" onclick="agregarAlGrupo('${d.id}')"><i class="ph-bold ph-plus"></i> Añadir</button>`;

                    html += `<div class="friend-card"><div class="friend-info"><img src="${j.foto||'https://via.placeholder.com/50'}" class="friend-avatar"><div><h4 class="friend-name">${j.nombre}</h4></div></div>${btnHtml}</div>`;
                }
            });
            lista.innerHTML = html || '<p style="text-align:center; grid-column:1/-1; color:#aaa;">No se encontraron jugadores.</p>';
        } catch(e) { lista.innerHTML = '<p style="color:red; text-align:center;">Error en búsqueda.</p>'; }
    };

    window.agregarAlGrupo = async function(uidJugador) {
        try {
            let actualizados = grupoActivo.miembros_uids || [];
            if(!actualizados.includes(uidJugador)) actualizados.push(uidJugador);
            
            await updateDoc(doc(db, 'grupos_amigos', grupoActivo.id), { miembros_uids: actualizados });
            grupoActivo.miembros_uids = actualizados;
            window.toast("¡Jugador añadido al grupo!");
            
            document.getElementById('btn-buscar-jugador').click();
            cargarMiembrosDelGrupo();
        } catch(e) { window.toast("Error al añadir"); }
    };

    window.quitarDelGrupo = async function(uidJugador) {
        if(!confirm("¿Quitar a este jugador del grupo?")) return;
        try {
            let actualizados = (grupoActivo.miembros_uids || []).filter(id => id !== uidJugador);
            await updateDoc(doc(db, 'grupos_amigos', grupoActivo.id), { miembros_uids: actualizados });
            grupoActivo.miembros_uids = actualizados;
            cargarMiembrosDelGrupo();
        } catch(e) { window.toast("Error al quitar"); }
    };

    // =====================================
    // EQUIPO IDEAL (RANKING DINÁMICO)
    // =====================================
    function dibujarEquipoIdeal(deporte) {
        const contenedor = document.getElementById('contenedor-cancha-ranking');
        if(miembrosDataGrupoActivo.length === 0) { contenedor.innerHTML = '<p style="text-align:center; color:#aaa; margin-top:30px;">Añade jugadores para armar el equipo ideal.</p>'; return; }

        let ranking = miembrosDataGrupoActivo.map(j => ({ ...j, score: j.rating ? Math.round(j.rating * 20) : Math.floor(Math.random()*30 + 70) }));
        
        const yo = { uid: currentUser.uid, nombre: currentUser.displayName || 'Tú', foto: currentUser.photoURL || 'https://via.placeholder.com/50', score: 99, posicion: 'CAPI' };
        ranking.push(yo);
        ranking.sort((a, b) => b.score - a.score);

        const generarCarta = (j) => {
            if(!j) return `<div class="player-pitch-card" style="opacity:0.3;"><div class="player-pitch-photo-container"><div style="width:100%; height:100%; background:#333; border:2px dashed #aaa; border-radius:10px 10px 25px 25px;"></div></div><div class="player-pitch-name">Falta</div></div>`;
            return `
            <div class="player-pitch-card" title="${j.nombre}">
                <div class="player-pitch-photo-container"><img src="${j.foto || 'https://via.placeholder.com/50'}"><div class="player-pitch-score">${j.score}</div></div>
                <div class="player-pitch-name">${j.nombre.split(' ')[0]}</div>
                <div style="background: rgba(0,0,0,0.8); color: #f1c40f; font-size: 0.55rem; padding: 2px 4px; border-radius: 4px; margin-top: 2px; border: 1px solid #f1c40f;">${j.posAsignada || j.posicion || 'JUG'}</div>
            </div>`;
        };

        function armarEquipo(rank, reqs) {
            let seleccionados = []; let disponibles = [...rank];
            reqs.forEach(req => {
                let idx = disponibles.findIndex(jug => jug.posicion && jug.posicion.includes(req));
                if (idx !== -1) { seleccionados.push({...disponibles[idx], posAsignada: req}); disponibles.splice(idx, 1); } 
                else if (disponibles.length > 0) { seleccionados.push({...disponibles[0], posAsignada: 'POL'}); disponibles.splice(0, 1); }
                else { seleccionados.push(null); }
            });
            return seleccionados;
        }

        let html = '';
        if (deporte === 'Fútbol') {
            const team = armarEquipo(ranking, ['ARQ', 'DEF', 'DEF', 'MED', 'MED', 'DEL', 'DEL']);
            html = `
            <div class="soccer-pitch">
                <div class="pitch-line pitch-center"></div><div class="pitch-line pitch-circle"></div>
                <div class="formation-row">${team.slice(5,7).map(generarCarta).join('')}</div>
                <div class="formation-row">${team.slice(3,5).map(generarCarta).join('')}</div>
                <div class="formation-row">${team.slice(1,3).map(generarCarta).join('')}</div>
                <div class="formation-row">${generarCarta(team[0])}</div>
            </div>`;
        } else if (deporte === 'Vóley') {
            const team = armarEquipo(ranking, ['ARM', 'OPU', 'ATQ', 'ATQ', 'CEN', 'LIB']);
            html = `
            <div class="voley-pitch">
                <div class="voley-line voley-center"></div>
                <div class="formation-row">${team.slice(2,5).map(generarCarta).join('')}</div>
                <div class="formation-row" style="margin-top:20px;">${team.slice(0,2).map(generarCarta).join('')}${generarCarta(team[5])}</div>
            </div>`;
        } else if (deporte === 'Básquet') {
            const team = armarEquipo(ranking, ['BAS', 'ESC', 'ALE', 'API', 'PIV']);
            html = `
            <div class="basket-pitch">
                <div class="basket-line basket-center"></div><div class="basket-line basket-circle"></div>
                <div class="formation-row" style="margin-top:20px;">${team.slice(3,5).map(generarCarta).join('')}</div>
                <div class="formation-row">${team.slice(1,3).map(generarCarta).join('')}</div>
                <div class="formation-row">${generarCarta(team[0])}</div>
            </div>`;
        } else {
            html = `<div style="background:rgba(0,0,0,0.5); padding:15px; border-radius:12px;">
                ${ranking.slice(0,10).map((j, i) => `
                <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid rgba(255,255,255,0.1);">
                    <div style="display:flex; gap:10px; align-items:center;"><b>${i+1}.</b><img src="${j.foto||'https://via.placeholder.com/30'}" style="width:30px; height:30px; border-radius:50%; object-fit:cover;"><span>${j.nombre}</span></div>
                    <span style="color:#f1c40f; font-weight:bold;">${j.score} pts</span>
                </div>`).join('')}
            </div>`;
        }

        contenedor.innerHTML = html;
    }
</script>
</body>
</html>
