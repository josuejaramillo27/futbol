<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolsa de Jugadores | APP FUTBOL</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1><i class="ph ph-soccer-ball"></i> APP FUTBOL</h1>
        <a href="index.html" class="btn btn-outline" style="width: auto; padding: 8px 15px;"><i class="ph-bold ph-arrow-left"></i> Volver</a>
    </header>

    <main>
        <div class="card" style="text-align: center; margin-bottom: 25px;">
            <h2>Bolsa de Jugadores 🤝</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Encuentra retadores o completa tu equipo para hoy.</p>
            
            <button id="btn-login-google" class="btn" style="margin-top: 15px; background: white; color: #000;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" style="width: 20px;"> 
                Iniciar sesión con Google para Publicar
            </button>

            <form id="form-anuncio" style="display: none; margin-top: 20px; text-align: left;">
                <textarea id="texto-anuncio" rows="2" placeholder="Ej: Soy arquero y busco equipo para hoy en la noche..." required></textarea>
                <button type="submit" class="btn">Publicar Anuncio</button>
            </form>
        </div>

        <div id="lista-jugadores" style="display: flex; flex-direction: column; gap: 15px;">
            <p style="text-align: center;">Cargando anuncios de la ciudad...</p>
        </div>
    </main>
    <script type="module" src="app.js"></script>
</body>
</html>
