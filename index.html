<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP FUTBOL | Encuentra tu Cancha</title>
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>APP FUTBOL ⚽</h1>
        </header>

    <main>
        <section>
            <h2>Encuentra, Reserva y Juega.</h2>
            <div id="lista-canchas">
                </div>
        </section>

        <section>
            <h3>Bolsa de Jugadores</h3>
            <div id="bolsa-jugadores">
                </div>
        </section>

        <hr>

        <section id="publicidad-dueños" style="text-align: center; padding: 20px; background-color: #f1f1f1; color: #333;">
            <h2>¿Eres dueño de una cancha? 🏟️</h2>
            <p>Digitaliza tus reservas, evita inasistencias y atrae cientos de jugadores en tu ciudad.</p>
            <button id="btn-contacto-admin">Únete a la Red APP FUTBOL</button>
        </section>
        <div id="modal-cancha" class="modal-oculto">
    <div class="modal-contenido">
        
        <button id="cerrar-modal" class="btn-cerrar"><i class="ph ph-x"></i></button>
        
        <div style="position: relative;">
            <img id="modal-imagen-principal" src="" style="width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-bottom: 1px solid var(--border-color);">
            
            <img id="modal-logo" src="" style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 4px solid var(--card-bg); position: absolute; bottom: -35px; left: 20px;">
        </div>
        
        <div style="padding: 45px 20px 25px 20px;">
            <h2 id="modal-nombre" style="font-size: 1.6rem; font-weight: 800; margin-bottom: 5px;">Nombre Cancha</h2>
            <p style="color: var(--primary-green); font-weight: 800; font-size: 1.1rem;">
                ⭐ <span id="modal-rating"></span> | 💰 S/ <span id="modal-precio"></span> / hr
            </p>
            
            <div style="margin: 20px 0; padding: 15px; background: #121212; border-radius: 12px; border: 1px solid var(--border-color);">
                <p style="margin-bottom: 8px;"><i class="ph ph-clock" style="color: var(--primary-green);"></i> <span id="modal-horario"></span></p>
                <p><i class="ph ph-map-pin" style="color: var(--primary-green);"></i> <a id="modal-link-maps" href="#" target="_blank" style="color: var(--text-main); text-decoration: underline;">Ver en Google Maps</a></p>
            </div>
            
            <h3 style="font-size: 1.1rem; margin-bottom: 8px;">Acerca de nosotros</h3>
            <p id="modal-descripcion" style="font-size: 0.9rem; color: var(--text-muted); line-height: 1.5;"></p>

            <div class="btn-group" style="margin-top: 25px;">
                <a id="btn-whatsapp-reserva" href="#" target="_blank" class="btn" style="background-color: #25D366; color: #000;">
                    <i class="ph-bold ph-whatsapp-logo" style="font-size: 1.2rem;"></i> Reservar por WhatsApp
                </a>
                
                <a id="btn-ver-resenas" href="#" class="btn btn-outline">
                    <i class="ph-bold ph-star"></i> Ver o Dejar Reseña
                </a>
            </div>
        </div>
    </div>
</div>
    </main>
    <script type="module" src="app.js"></script>
</body>
</html>
