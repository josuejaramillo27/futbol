<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP FUTBOL | Encuentra tu Cancha</title>
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>APP FUTBOL ⚽</h1>
        </header>

    <main>
        <section>
            <h2>Encuentra, Reserva y Juega.</h2>
            <div id="lista-canchas">
                </div>
        </section>

        <section>
            <h3>Bolsa de Jugadores</h3>
            <div id="bolsa-jugadores">
                </div>
        </section>

        <hr>

        <section id="publicidad-dueños" style="text-align: center; padding: 20px; background-color: #f1f1f1; color: #333;">
            <h2>¿Eres dueño de una cancha? 🏟️</h2>
            <p>Digitaliza tus reservas, evita inasistencias y atrae cientos de jugadores en tu ciudad.</p>
            <button id="btn-contacto-admin">Únete a la Red APP FUTBOL</button>
        </section>
        <div id="modal-cancha" class="modal-oculto">
    <div class="modal-contenido card">
        <button id="cerrar-modal" class="btn-cerrar"><i class="ph ph-x"></i></button>
        
        <img id="modal-imagen-principal" src="" style="width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px; border: 1px solid var(--border-color);">
        
        <div style="display:flex; align-items:center; gap:15px; margin-top:15px;">
            <img id="modal-logo" src="" style="width:60px; height:60px; border-radius:50%; object-fit:cover; border:2px solid var(--primary-green);">
            <h2 id="modal-nombre">Nombre Cancha</h2>
        </div>
        
        <p style="color: var(--primary-green); font-weight:bold; margin-top:10px;">⭐ <span id="modal-rating"></span> | 💰 S/ <span id="modal-precio"></span> / hr</p>
        <p><i class="ph ph-clock"></i> <span id="modal-horario"></span></p>
        <p><i class="ph ph-map-pin"></i> <a id="modal-link-maps" href="#" target="_blank" style="color:#00e676;">Ver en Google Maps</a></p>
        
        <hr style="border-color:#333; margin:15px 0;">
        
        <h3>Acerca de nosotros</h3>
        <p id="modal-descripcion" style="font-size:0.9rem; color:var(--text-muted);"></p>

        <a id="btn-whatsapp-reserva" href="#" target="_blank" class="btn" style="margin-top:20px; background-color:#25D366; color:#fff; text-align:center; text-decoration:none;">
            <i class="ph ph-whatsapp-logo"></i> Reservar por WhatsApp
        </a>
        
        <a id="btn-ver-resenas" href="#" class="btn btn-outline" style="text-align:center; text-decoration:none;">
            ⭐ Ver o Dejar Reseña
        </a>
    </div>
</div>
    </main>
    <script type="module" src="app.js"></script>
</body>
</html>
