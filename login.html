<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Socios | APP FUTBOL</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
    
    <div class="login-wrapper">
        <div id="login-container" class="card">
            
            <div class="login-header">
                <h2><i class="ph-fill ph-soccer-ball"></i> APP FUTBOL</h2>
                <h3 id="form-title">Panel de Socios</h3>
                <p id="form-subtitle">Gestiona tu cancha, automatiza tus reservas y aumenta tus ingresos.</p>
            </div>
            
            <form id="auth-form">
                <div id="register-fields" style="display: none;">
                    <label for="reg-nombre">Nombre Completo del Propietario:</label>
                    <input type="text" id="reg-nombre" placeholder="Ej. Juan Pérez">

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div>
                            <label for="reg-dni">DNI / Documento:</label>
                            <input type="text" id="reg-dni" placeholder="12345678">
                        </div>
                        <div>
                            <label for="reg-telefono">WhatsApp:</label>
                            <input type="tel" id="reg-telefono" placeholder="987654321">
                        </div>
                    </div>

                    <label for="reg-complejo">Nombre del Complejo:</label>
                    <input type="text" id="reg-complejo" placeholder="Ej. Complejo Deportivo El 10">

                    <label for="reg-direccion">Dirección del Complejo:</label>
                    <input type="text" id="reg-direccion" placeholder="Ej. Av. Principal 123, Piura">
                    <hr style="border: 1px solid var(--border-color); margin: 15px 0;">
                </div>

                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" placeholder="ejemplo@tucancha.com" required>
                
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="••••••••" required>
                
                <div class="login-buttons" id="login-actions">
                    <button type="button" id="btn-login" class="btn hero-primary">Iniciar Sesión</button>
                    <button type="button" id="btn-show-register" class="btn btn-outline">Crear Cuenta de Dueño</button>
                </div>

                <div class="login-buttons" id="register-actions" style="display: none;">
                    <button type="button" id="btn-register" class="btn hero-primary">Enviar Solicitud</button>
                    <button type="button" id="btn-show-login" class="btn btn-outline"><i class="ph-bold ph-arrow-left"></i> Volver a Iniciar Sesión</button>
                </div>
            </form>
            
            <p id="auth-error-message" style="color: var(--danger); margin-top:15px; text-align:center; font-weight:bold; font-size:0.85rem;"></p>
            <p id="auth-success-message" style="color: var(--primary-green); margin-top:15px; text-align:center; font-weight:bold; font-size:0.85rem; display:none;"></p>
        </div>
    </div>

    <script type="module" src="auth.js"></script> 
</body>
</html>
