<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Socios | APP FUTBOL</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
    
    <div class="login-wrapper">
        <div id="login-container" class="card">
            
            <div class="login-header">
                <h2><i class="ph ph-soccer-ball"></i> APP FUTBOL</h2>
                <h3>Panel de Socios</h3>
                <p>Gestiona tu cancha, automatiza tus reservas y aumenta tus ingresos.</p>
            </div>
            
            <form id="auth-form">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" placeholder="ejemplo@tucancha.com" required>
                
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="••••••••" required>
                
                <div class="login-buttons">
                    <button type="button" id="btn-login" class="btn">Iniciar Sesión</button>
                    <button type="button" id="btn-register" class="btn btn-outline">Crear Cuenta de Dueño</button>
                </div>
            </form>
            
            <p id="auth-error-message" style="color: var(--danger); margin-top:15px; text-align:center; font-weight:bold; font-size:0.9rem;"></p>
        </div>
    </div>

    <script type="module" src="auth.js"></script> 
</body>
</html>
