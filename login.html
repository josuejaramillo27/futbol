<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Propietarios | APP FUTBOL</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="login-container">
        <h2>Panel de Socios</h2>
        <p>Inicia sesión para gestionar tu cancha.</p>
        
        <form id="auth-form">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" required>
            
            <label for="password">Contraseña:</label>
            <input type="password" id="password" required>
            
            <button type="button" id="btn-login">Iniciar Sesión</button>
            <button type="button" id="btn-register">Crear Cuenta de Dueño</button>
        </form>
        <p id="auth-error-message" style="color: red;"></p>
    </div>

    <script src="auth.js"></script> 
</body>
</html>
