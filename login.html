<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Socios | CHALACAPP</title>
    <link rel="icon" type="image/png" href="logo-chalacapp-nav.png">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ==========================================
           ESTILOS ESPECÍFICOS PARA EL LOGIN PREMIUM
           ========================================== */
        .login-body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at top right, #0a1310, #040605);
            background-image: url('https://images.unsplash.com/photo-1518605368461-1e1e38ce81ba?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Capa oscura sobre el fondo de la cancha */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 6, 5, 0.85);
            backdrop-filter: blur(8px);
            z-index: 0;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px; /* Ancho máximo para que no se estire */
        }

        #login-container {
            padding: 40px 35px;
            background: rgba(15, 23, 20, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(46, 204, 113, 0.2);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
            margin: 0;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-brand {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .login-brand img {
            height: 45px;
            width: auto;
            object-fit: contain;
        }

        #form-title {
            font-size: 1.6rem;
            margin: 0 0 8px 0;
            color: #fff;
        }

        #form-subtitle {
            color: var(--text-muted, #888);
            font-size: 0.95rem;
            line-height: 1.4;
            margin: 0;
        }

        /* Campos de texto modernos */
        #auth-form label {
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 8px;
            display: block;
            font-weight: 500;
        }

        #auth-form input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
        }

        #auth-form input:focus {
            border-color: var(--primary-green, #2ecc71);
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.15);
            background: rgba(0, 0, 0, 0.6);
        }

        /* Ocultar flechas en campos numéricos */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .login-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .login-buttons .btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border-radius: 12px;
        }

        .grid-2-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
    </style>
</head>
<body class="login-body">
    
    <div class="login-overlay"></div>

    <div class="login-wrapper">
        <div id="login-container" class="card">
            
            <div class="login-header">
                <!-- TU NUEVO LOGO -->
                <div class="login-brand">
                    <img src="logo-chalacapp-nav.png" alt="Logo Chalacapp">
                    <span style="font-size: 1.5rem; letter-spacing: 1px; color:#fff;">CHALACAPP</span>
                </div>
                
                <h3 id="form-title">Acceso Socios</h3>
                <p id="form-subtitle">Gestiona tu cancha, automatiza tus reservas y aumenta tus ingresos.</p>
            </div>
            
            <form id="auth-form">
                <div id="register-fields" style="display: none;">
                    <label for="reg-nombre">Nombre Completo del Propietario</label>
                    <input type="text" id="reg-nombre" placeholder="Ej. Juan Pérez">

                    <div class="grid-2-cols">
                        <div>
                            <label for="reg-dni">DNI / Documento</label>
                            <input type="number" id="reg-dni" placeholder="12345678">
                        </div>
                        <div>
                            <label for="reg-telefono">WhatsApp</label>
                            <input type="tel" id="reg-telefono" placeholder="987654321">
                        </div>
                    </div>

                    <label for="reg-complejo">Nombre del Complejo</label>
                    <input type="text" id="reg-complejo" placeholder="Ej. Complejo Deportivo El 10">

                    <label for="reg-direccion">Dirección del Complejo</label>
                    <input type="text" id="reg-direccion" placeholder="Ej. Av. Principal 123, Piura">
                    
                    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 25px 0;">
                </div>

                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@tucancha.com" required>
                
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
                
                <div class="login-buttons" id="login-actions">
                    <button type="button" id="btn-login" class="btn hero-primary">Iniciar Sesión</button>
                    <button type="button" id="btn-show-register" class="btn btn-outline">Solicitar Cuenta de Dueño</button>
                </div>

                <div class="login-buttons" id="register-actions" style="display: none;">
                    <button type="button" id="btn-register" class="btn hero-primary">Enviar Solicitud</button>
                    <button type="button" id="btn-show-login" class="btn btn-outline"><i class="ph-bold ph-arrow-left"></i> Volver a Iniciar Sesión</button>
                </div>
            </form>
            
            <p id="auth-error-message" style="color: #ff6b6b; margin-top:20px; text-align:center; font-weight:bold; font-size:0.9rem;"></p>
            <p id="auth-success-message" style="color: var(--primary-green); margin-top:20px; text-align:center; font-weight:bold; font-size:0.9rem; display:none;"></p>
        </div>
    </div>

    <script type="module" src="auth.js"></script> 
</body>
</html>
