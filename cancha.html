<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info y Reseñas | APP FUTBOL</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .cancha-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
            align-items: start;
        }

        @media (min-width: 800px) {
            .cancha-layout {
                grid-template-columns: 320px 1fr;
                gap: 30px;
            }
            .sticky-sidebar {
                position: sticky;
                top: 20px;
            }
        }

        /* Estilos del selector de estrellas en el modal */
        .star-picker {
            display: flex;
            gap: 8px;
            justify-content: center;
            font-size: 2.2rem;
            color: #444;
            cursor: pointer;
            margin: 15px 0;
        }
        .star-picker i.selected, .star-picker i:hover {
            color: var(--warning, #f1c40f);
        }

        /* Chips / Etiquetas rápidas tipo InDrive */
        .quick-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 15px 0;
        }
        .tag-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color, rgba(255,255,255,0.1));
            color: #ccc;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .tag-chip:hover {
            border-color: var(--primary-green, #2ecc71);
            color: #fff;
        }
        .tag-chip.active {
            background: var(--primary-green, #2ecc71);
            color: #000;
            font-weight: bold;
            border-color: var(--primary-green, #2ecc71);
        }

        .tag-badge {
            display: inline-block;
            background: rgba(46, 204, 113, 0.1);
            color: var(--primary-green, #2ecc71);
            border: 1px solid rgba(46, 204, 113, 0.2);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-right: 5px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark"><i class="ph-fill ph-soccer-ball"></i></span>
            <span>APP <b>FUTBOL</b></span>
        </div>
        <a href="index.html" class="btn btn-outline" style="width: auto; padding: 8px 15px;"><i class="ph-bold ph-arrow-left"></i> Volver</a>
    </header>

    <main class="cancha-layout" style="padding: 20px;">
        
        <div class="sticky-sidebar">
            <div id="court-info" class="card" style="text-align: center; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; margin:0;">
                <img id="court-logo" src="" alt="Logo" style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary-green); display: none;" onload="this.style.display='block'">
                
                <h2 id="court-title" style="margin: 0; font-size: 1.8rem;">Cargando Cancha...</h2>
                
                <p id="court-meta" style="color: var(--text-muted); font-size: 0.95rem; margin: 0; display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;"></p>
                
                <div id="court-rating" style="display: flex; flex-direction: column; align-items: center; margin-top: 5px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%;">
                    <i class="ph-bold ph-spinner-gap ph-spin"></i>
                </div>
            </div>
        </div>

        <div class="card" style="margin: 0;">
            
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color);">
                <h3 style="margin: 0; display: flex; align-items: center; gap: 8px;">
                    <i class="ph-fill ph-star" style="color:var(--warning);"></i> Opiniones de Jugadores
                </h3>
                
                <button id="btn-open-review-modal" class="btn hero-primary" style="width: auto; padding: 8px 18px; font-size: 0.9rem;">
                    <i class="ph-bold ph-star"></i> Escribir una Reseña
                </button>
            </div>
            
            <div style="display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;">
                <button class="btn btn-outline filter-btn active" data-star="all" style="width: auto; padding: 6px 14px; font-size: 0.85rem;">Todas</button>
                <button class="btn btn-outline filter-btn" data-star="5" style="width: auto; padding: 6px 14px; font-size: 0.85rem;">5 <i class="ph-fill ph-star" style="color:var(--warning)"></i></button>
                <button class="btn btn-outline filter-btn" data-star="4" style="width: auto; padding: 6px 14px; font-size: 0.85rem;">4 <i class="ph-fill ph-star" style="color:var(--warning)"></i></button>
                <button class="btn btn-outline filter-btn" data-star="3" style="width: auto; padding: 6px 14px; font-size: 0.85rem;">3 <i class="ph-fill ph-star" style="color:var(--warning)"></i></button>
                <button class="btn btn-outline filter-btn" data-star="2" style="width: auto; padding: 6px 14px; font-size: 0.85rem;">2 <i class="ph-fill ph-star" style="color:var(--warning)"></i></button>
                <button class="btn btn-outline filter-btn" data-star="1" style="width: auto; padding: 6px 14px; font-size: 0.85rem;">1 <i class="ph-fill ph-star" style="color:var(--warning)"></i></button>
            </div>
            
            <div id="reviews-list">
                <div style="text-align:center; padding:30px; color:var(--text-muted);"><i class="ph-bold ph-spinner-gap ph-spin"></i> Cargando reseñas...</div>
            </div>
        </div>

    </main>

    <div id="modal-publicar-resena" class="admin-modal">
        <div class="admin-modal-card" style="max-width: 500px; text-align: center; padding: 25px;">
            <button type="button" class="btn-cerrar admin-modal-close" id="btn-close-review-modal"><i class="ph-bold ph-x"></i></button>
            
            <h3 style="margin-bottom: 5px;">Calificar Cancha</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0;">¿Cómo fue tu experiencia en el partido?</p>

            <div class="star-picker" id="star-picker">
                <i class="ph-fill ph-star" data-val="1"></i>
                <i class="ph-fill ph-star" data-val="2"></i>
                <i class="ph-fill ph-star" data-val="3"></i>
                <i class="ph-fill ph-star" data-val="4"></i>
                <i class="ph-fill ph-star" data-val="5"></i>
            </div>
            <span id="star-label" style="font-weight: bold; color: var(--primary-green); font-size: 0.95rem;">Toca las estrellas para calificar</span>

            <div id="quick-tags-box" style="margin-top: 15px; display: none;">
                <small style="color: var(--text-muted); display: block; margin-bottom: 8px;">Selecciona lo que más destacó (Opcional):</small>
                <div class="quick-tags" id="quick-tags-container"></div>
            </div>

            <textarea id="review-comment-input" rows="3" placeholder="Añade un comentario adicional (Opcional)..." style="width: 100%; margin-top: 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 8px; outline: none; font-family: inherit; resize: none;"></textarea>

            <button id="btn-submit-review" class="btn hero-primary" style="width: 100%; margin-top: 15px;" disabled>
                Publicar Reseña
            </button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
