<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080B0A">
    <title>Perfil de Cancha | CHALACAPP</title>
    
    <link rel="icon" type="image/png" href="logo-chalacapp-nav.png">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="booking.css">
    <link rel="stylesheet" href="phase34-public.css">
    
    <style>
        /* ESTILOS ULTRA-COMPACTOS PARA ENCAJE PERFECTO A PRIMERA VISTA EN CUALQUIER MÓVIL */
        body { background: #080B0A; min-height: 100vh; display: flex; flex-direction: column; margin: 0; padding: 0; font-family: inherit; }
        
        /* BARRA SUPERIOR COMPACTA */
        .topbar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: rgba(8, 11, 10, 0.98);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 100;
            height: 40px;
            box-sizing: border-box;
        }

        .back-link-top {
            color: #ffffff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 0.82rem;
            transition: color 0.2s ease;
        }
        .back-link-top:hover { color: var(--primary-green); }
        .back-link-top i { font-size: 1rem; color: var(--primary-green); }

        /* PORTADA COMPACTA Y PROPORCIONADA */
        .bio-header { position: relative; height: 130px; width: 100%; overflow: hidden; flex-shrink: 0; }
        .bio-cover { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.65); }
        .bio-cover-gradient { position: absolute; bottom: 0; width: 100%; height: 80px; background: linear-gradient(to top, #080B0A, transparent); }
        
        /* Logo centrado más compacto */
        .bio-logo-wrapper { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 65px; height: 65px; border-radius: 50%; border: 2.5px solid #080B0A; overflow: hidden; background: #111; z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        .bio-logo { width: 100%; height: 100%; object-fit: cover; }

        /* Contenedor optimizado para que todo quepa a primera vista */
        .bio-body { padding: 10px 14px 20px; text-align: center; max-width: 480px; margin: 0 auto; flex: 1; width: 100%; box-sizing: border-box; }
        .bio-title { font-size: 1.25rem; color: #fff; margin: 0 0 2px 0; font-weight: 800; letter-spacing: -0.3px; line-height: 1.2; }
        .bio-location { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 8px; }
        
        /* Métricas reducidas */
        .bio-metrics { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .bio-metric-box { background: rgba(255,255,255,0.03); padding: 5px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); min-width: 80px; }
        .bio-metric-icon { color: var(--primary-green); font-size: 1rem; margin-bottom: 1px; }
        .bio-metric-val { color: #fff; font-size: 0.78rem; font-weight: bold; }

        /* Descripción liviana */
        .bio-desc { color: #ccc; font-size: 0.8rem; margin-bottom: 10px; line-height: 1.35; background: rgba(255,255,255,0.02); padding: 8px 10px; border-radius: 8px; font-style: italic; }
        
        /* Botones optimizados en altura */
        .bio-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 10px 14px; background: linear-gradient(45deg, var(--primary-green), #27ae60); color: #000; font-weight: 800; font-size: 0.88rem; border: none; border-radius: 10px; cursor: pointer; text-decoration: none; margin-bottom: 8px; box-shadow: 0 3px 12px rgba(46, 204, 113, 0.2); transition: transform 0.2s; box-sizing: border-box; }
        .bio-btn:active { transform: scale(0.98); }
        .bio-btn-outline { background: transparent; border: 1.5px solid rgba(255,255,255,0.2); color: #fff; box-shadow: none; margin-bottom: 0; }

        /* ADAPTATIVO PARA CELULARES CON PANTALLAS MÁS CORTAS DE ALTURA */
        @media (max-height: 680px) {
            .bio-header { height: 105px; }
            .bio-logo-wrapper { width: 55px; height: 55px; bottom: 2px; }
            .bio-title { font-size: 1.15rem; }
            .bio-body { padding: 6px 12px 15px; }
            .bio-desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; padding: 6px 8px; font-size: 0.75rem; }
            .bio-btn { padding: 8px 12px; font-size: 0.82rem; margin-bottom: 6px; }
            .bio-metrics { margin-bottom: 6px; }
            .bio-metric-box { padding: 4px 8px; }
            #court-rating { margin-bottom: 8px !important; }
        }
    </style>
</head>
<body>

    <header class="topbar-header">
        <a href="index.html" class="back-link-top">
            <i class="ph-bold ph-arrow-left"></i> Explorar más
        </a>
        <span style="font-size: 0.85rem; font-weight: 900; letter-spacing: 1px; color: #fff;">CHALACAPP</span>
    </header>

    <main>
        <div class="bio-header">
            <img id="bio-cover" class="bio-cover" src="" alt="Portada">
            <div class="bio-cover-gradient"></div>
            <div class="bio-logo-wrapper">
                <img id="bio-logo" class="bio-logo" src="" alt="Logo">
            </div>
        </div>

        <div class="bio-body">
            <h1 id="bio-title" class="bio-title">Cargando...</h1>
            <p id="bio-location" class="bio-location"><i class="ph-bold ph-map-pin"></i> ...</p>
            
            <div id="court-rating" style="margin-bottom: 10px; display: flex; flex-direction: column; align-items: center;"></div>
            
            <div class="bio-metrics">
                <div class="bio-metric-box">
                    <i class="ph-fill ph-soccer-ball bio-metric-icon"></i>
                    <div id="bio-tipo" class="bio-metric-val">...</div>
                </div>
                <div class="bio-metric-box">
                    <i class="ph-fill ph-money bio-metric-icon"></i>
                    <div id="bio-precio" class="bio-metric-val">...</div>
                </div>
            </div>

            <p id="bio-desc" class="bio-desc"></p>

            <button id="btn-reservar-bio" class="bio-btn"><i class="ph-bold ph-calendar-check"></i> Ver Horarios y Reservar</button>
            <a id="btn-mapa-bio" href="#" target="_blank" class="bio-btn bio-btn-outline"><i class="ph-bold ph-navigation-arrow"></i> Cómo llegar (GPS)</a>
            
            <hr style="border: none; border-top: 1px dashed rgba(255,255,255,0.1); margin: 25px 0;">

            <h3 style="color: #fff; margin-bottom: 6px; font-size: 1.1rem;">¿Ya jugaste aquí?</h3>
            <p id="star-label" style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 12px;">Ayuda a otros tocando las estrellas</p>
            <div id="star-picker" style="font-size: 2.2rem; color: #333; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: center; gap: 4px;">
                <i class="ph-fill ph-star" data-val="1"></i>
                <i class="ph-fill ph-star" data-val="2"></i>
                <i class="ph-fill ph-star" data-val="3"></i>
                <i class="ph-fill ph-star" data-val="4"></i>
                <i class="ph-fill ph-star" data-val="5"></i>
            </div>
            
            <div id="quick-tags-box" style="display: none; margin-bottom: 20px;">
                <p style="color: #ccc; font-size: 0.8rem; margin-bottom: 10px;">¿Qué destacarías?</p>
                <div id="quick-tags-container" style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;"></div>
            </div>

            <button id="btn-submit-review" class="btn" style="background: rgba(255,255,255,0.05); color: #888; border: 1px solid rgba(255,255,255,0.1); width: 100%; font-size: 0.85rem; padding: 10px;" disabled>Publicar Calificación</button>
        </div>
    </main>

    <div id="modal-cancha" class="modal-oculto">
        <div class="modal-contenido bottom-sheet" style="padding: 20px 16px; text-align: left; max-height: 85vh; overflow-y: auto;">
            <button id="cerrar-modal" class="btn-cerrar"><i class="ph-bold ph-x"></i></button>
            <span class="mini-label" style="color: var(--primary-green);">DISPONIBILIDAD EN VIVO</span>
            <h2 id="modal-nombre-interno" style="margin-bottom: 15px; color: #fff; font-size: 1.3rem;">Elige un horario</h2>
            <div id="modal-disponibilidad"></div>
        </div>
    </div>

    <div id="modal-reserva" class="modal-oculto">
        <div class="modal-contenido center-modal" style="background:#111; border:1px solid var(--primary-green); padding: 20px;">
            <button id="cerrar-reserva" class="btn-cerrar"><i class="ph-bold ph-x"></i></button>
            <h2 style="color: var(--primary-green); margin-top:0; font-size: 1.3rem;"><i class="ph-fill ph-calendar-plus"></i> Tu Reserva</h2>
            <div style="background:rgba(255,255,255,0.05); padding:12px; border-radius:10px; margin-bottom:15px; border:1px solid rgba(255,255,255,0.1);">
                <p id="booking-cancha-nombre" style="margin:0 0 4px 0; color:#fff; font-weight:bold; font-size:1rem;"></p>
                <p id="booking-hora" style="margin:0; color:var(--primary-green); font-size:1.1rem; font-weight:900;"></p>
            </div>
            <div class="filter-field" style="margin-bottom:12px;"><span>Tu Nombre</span><input type="text" id="booking-nombre" placeholder="Ej. Juan Pérez" style="width:100%; padding:10px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2); border-radius:8px; color:#fff;"></div>
            <div class="filter-field" style="margin-bottom:15px;"><span>WhatsApp de contacto</span><input type="tel" id="booking-telefono" placeholder="Ej. 987654321" style="width:100%; padding:10px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2); border-radius:8px; color:#fff;"></div>
            
            <button id="btn-confirmar-reserva" class="btn hero-primary" style="width:100%; padding: 12px; font-size: 0.95rem;"><i class="ph-bold ph-whatsapp-logo"></i> Confirmar por WhatsApp</button>
            <div id="booking-status"></div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
