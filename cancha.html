<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Cancha</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html">⬅ Volver al Hub</a>
        <h1 id="cancha-nombre">Cargando...</h1>
    </header>

    <main class="container">
        <section class="cancha-detalle card">
            <h2 id="cancha-precio"></h2>
            <p><strong>Servicios Incluidos: </strong><span id="cancha-servicios"></span></p>
            
            <h3>Disponibilidad Hoy</h3>
            <div id="horarios-grid" class="horarios-grid">
                </div>
        </section>

        <section class="reseñas card mt-2">
            <h3>Reseñas de Jugadores</h3>
            <div id="lista-reseñas">
                </div>
            <div class="form-reseña card mt-2">
    <h4>Deja tu Reseña (Estilo InDrive)</h4>
    <div class="estrellas-container">
        <i class="ph ph-star" data-valor="1"></i>
        <i class="ph ph-star" data-valor="2"></i>
        <i class="ph ph-star" data-valor="3"></i>
        <i class="ph ph-star" data-valor="4"></i>
        <i class="ph ph-star" data-valor="5"></i>
    </div>
    <div id="tags-dinamicos" class="tags-container">
        </div>
    <button class="btn btn-outline">Calificar Cancha</button>
</div>
        </section>
    </main>
    <script type="module" src="app.js"></script>
</body>
</html>
