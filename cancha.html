<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info y Calificación | APP FUTBOL</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .cancha-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 900px; /* Más compacto */
            margin: 0 auto;
            align-items: start;
        }

        @media (min-width: 800px) {
            .cancha-layout {
                grid-template-columns: 320px 1fr;
                gap: 25px;
            }
            .sticky-sidebar {
                position: sticky;
                top: 20px;
            }
        }

        /* Estrellas más pequeñas para que no ocupe tanto espacio */
        .star-picker {
            display: flex;
            gap: 10px;
            justify-content: center;
            font-size: 2.2rem; 
            color: #333;
            cursor: pointer;
            margin: 15px 0;
            transition: all 0.2s ease;
        }
        .star-picker i.selected, .star-picker i:hover {
            color: var(--warning, #f1c40f);
            transform: scale(1.1);
        }

        /* Chips más delgados */
        .quick-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 15px 0 20px 0;
        }
        .tag-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .tag-chip:hover {
            border-color: var(--primary-green, #2ecc71);
            color: #fff;
        }
        .tag-chip.active {
            background: var(--primary-green, #2ecc71);
            color: #000;
            font-weight: bold;
            border-color: var(--primary-green, #2ecc71);
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand" style="display: flex; align-items: center; gap: 10px;">
    <img src="logo-chalacapp-nav.png" alt="Logo Chalacapp" style="height: 32px; width: auto; object-fit: contain;">
    <span style="font-size: 1.3rem; letter-spacing: 1px;"><b>CHALACAPP</b></span>
</div>
        <a href="index.html" class="btn btn-outline" style="width: auto; padding: 8px 15px;"><i class="ph-bold ph-arrow-left"></i> Volver</a>
    </header>

    <main class="cancha-layout" style="padding: 20px;">
        
        <div class="sticky-sidebar">
            <div id="court-info" class="card" style="text-align: center; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; margin:0;">
                <img id="court-logo" src="" alt="Logo" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-green); display: none;" onload="this.style.display='block'">
                
                <h2 id="court-title" style="margin: 0; font-size: 1.6rem;">Cargando Cancha...</h2>
                
                <p id="court-meta" style="color: var(--text-muted); font-size: 0.9rem; margin: 0; display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;"></p>
                
                <div id="court-rating" style="display: flex; flex-direction: column; align-items: center; margin-top: 5px; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%;">
                    <i class="ph-bold ph-spinner-gap ph-spin"></i>
                </div>
            </div>
        </div>

        <div class="card" style="margin: 0; padding: 30px 25px; text-align: center;">
            
            <h3 style="margin-bottom: 5px; font-size: 1.4rem;">⭐ Calificar Cancha</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0;">¿Qué tal estuvo tu experiencia?</p>

            <div class="star-picker" id="star-picker">
                <i class="ph-fill ph-star" data-val="1"></i>
                <i class="ph-fill ph-star" data-val="2"></i>
                <i class="ph-fill ph-star" data-val="3"></i>
                <i class="ph-fill ph-star" data-val="4"></i>
                <i class="ph-fill ph-star" data-val="5"></i>
            </div>
            <span id="star-label" style="font-weight: bold; color: var(--primary-green); font-size: 0.95rem;">Toca las estrellas para calificar</span>

            <div id="quick-tags-box" style="margin-top: 20px; display: none;">
                <small style="color: var(--text-muted); display: block; margin-bottom: 10px; font-size: 0.85rem;">Selecciona lo que más destacó:</small>
                <div class="quick-tags" id="quick-tags-container"></div>
            </div>

            <button id="btn-submit-review" class="btn hero-primary" style="width: 100%; margin-top: 10px; padding: 12px; font-size: 1rem;" disabled>
                Publicar Calificación
            </button>

        </div>

    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
