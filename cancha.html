<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080B0A">
    <title>Perfil de Cancha | CHALACAPP</title>
    
    <link rel="icon" type="image/png" href="logo-chalacapp-nav.png">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="booking.css">
    <link rel="stylesheet" href="phase34-public.css">
    
    <style>
        /* ESTILOS EXCLUSIVOS PARA EL "LINK EN BIO" - MEJORADOS */
        body { background: #080B0A; min-height: 100vh; display: flex; flex-direction: column; }
        
        .bio-header { position: relative; height: 280px; width: 100%; overflow: hidden; }
        .bio-cover { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); }
        .bio-cover-gradient { position: absolute; bottom: 0; width: 100%; height: 150px; background: linear-gradient(to top, #080B0A, transparent); }
        
        /* 🔥 MEJORA: Logo subido para estar totalmente integrado en el degradado oscuro */
        .bio-logo-wrapper { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 110px; height: 110px; border-radius: 50%; border: 4px solid #080B0A; overflow: hidden; background: #111; z-index: 10; box-shadow: 0 5px 25px rgba(0,0,0,0.8); }
        .bio-logo { width: 100%; height: 100%; object-fit: cover; }
        
        /* 🔥 MEJORA: Botón Volver Minimalista y Transparente */
        .bio-back-link { color: rgba(255,255,255,0.8); text-decoration: none; display: flex; align-items: center; gap: 6px; font-weight: bold; padding: 10px 0; font-size: 0.85rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); transition: color 0.3s; }
        .bio-back-link:hover { color: var(--primary-green); }

        /* 🔥 MEJORA: Breathing del cuerpo ajustado sin compensación excesiva */
        .bio-body { padding: 30px 20px 40px; text-align: center; max-width: 600px; margin: 0 auto; flex: 1; width: 100%; box-sizing: border-box; }
        .bio-title { font-size: 2rem; color: #fff; margin: 0 0 8px 0; font-weight: 900; letter-spacing: -0.5px; }
        .bio-location { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 15px; }
        
        .bio-metrics { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .bio-metric-box { background: rgba(255,255,255,0.03); padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); width: 100px; }
        .bio-metric-icon { color: var(--primary-green); font-size: 1.5rem; margin-bottom: 5px; }
        .bio-metric-val { color: #fff; font-size: 0.9rem; font-weight: bold; }

        .bio-desc { color: #ccc; font-size: 0.95rem; margin-bottom: 30px; line-height: 1.6; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 12px; font-style: italic; }
        
        .bio-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px; background: linear-gradient(45deg, var(--primary-green), #27ae60); color: #000; font-weight: 900; font-size: 1.1rem; border: none; border-radius: 14px; cursor: pointer; text-decoration: none; margin-bottom: 15px; box-shadow: 0 8px 25px rgba(46, 204, 113, 0.25); transition: transform 0.3s; }
        .bio-btn:hover { transform: translateY(-3px); }
        .bio-btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.2); color: #fff; box-shadow: none; }
    </style>
</head>
<body>

    <header style="position: absolute; top: 20px; left: 20px; z-index: 100;">
        <a href="index.html" class="bio-back-link">
            <i class="ph-bold ph-arrow-left"></i> Explorar más
        </a>
    </header>

    <main>
        <div class="bio-header">
            <img id="bio-cover" class="bio-cover" src="" alt="Portada">
            <div class="bio-cover-gradient"></div>
            <div class="bio-logo-wrapper">
                <img id="bio-logo" class="bio-logo" src="" alt="Logo">
            </div>
        </div>

        <div class="bio-body">
            <h1 id="bio-title" class="bio-title">Cargando...</h1>
            <p id="bio-location" class="bio-location"><i class="ph-bold ph-map-pin"></i> ...</p>
            
            <div id="court-rating" style="margin-bottom: 25px; display: flex; flex-direction: column; align-items: center;"></div>
            
            <div class="bio-metrics">
                <div class="bio-metric-box">
                    <i class="ph-fill ph-soccer-ball bio-metric-icon"></i>
                    <div id="bio-tipo" class="bio-metric-val">...</div>
                </div>
                <div class="bio-metric-box">
                    <i class="ph-fill ph-money bio-metric-icon"></i>
                    <div id="bio-precio" class="bio-metric-val">...</div>
                </div>
            </div>

            <p id="bio-desc" class="bio-desc"></p>

            <button id="btn-reservar-bio" class="bio-btn"><i class="ph-bold ph-calendar-check"></i> Ver Horarios y Reservar</button>
            <a id="btn-mapa-bio" href="#" target="_blank" class="bio-btn bio-btn-outline"><i class="ph-bold ph-navigation-arrow"></i> Cómo llegar (GPS)</a>
            
            <hr style="border: none; border-top: 1px dashed rgba(255,255,255,0.1); margin: 35px 0;">

            <h3 style="color: #fff; margin-bottom: 10px;">¿Ya jugaste aquí?</h3>
            <p id="star-label" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px;">Ayuda a otros tocando las estrellas</p>
            <div id="star-picker" style="font-size: 2.8rem; color: #333; margin-bottom: 15px; cursor: pointer; display: flex; justify-content: center; gap: 5px;">
                <i class="ph-fill ph-star" data-val="1"></i>
                <i class="ph-fill ph-star" data-val="2"></i>
                <i class="ph-fill ph-star" data-val="3"></i>
                <i class="ph-fill ph-star" data-val="4"></i>
                <i class="ph-fill ph-star" data-val="5"></i>
            </div>
            
            <div id="quick-tags-box" style="display: none; margin-bottom: 25px;">
                <p style="color: #ccc; font-size: 0.85rem; margin-bottom: 12px;">¿Qué destacarías?</p>
                <div id="quick-tags-container" style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;"></div>
            </div>

            <button id="btn-submit-review" class="btn" style="background: rgba(255,255,255,0.05); color: #888; border: 1px solid rgba(255,255,255,0.1); width: 100%;" disabled>Publicar Calificación</button>
        </div>
    </main>

    <div id="modal-cancha" class="modal-oculto">
        <div class="modal-contenido bottom-sheet" style="padding: 25px 20px; text-align: left; max-height: 85vh; overflow-y: auto;">
            <button id="cerrar-modal" class="btn-cerrar"><i class="ph-bold ph-x"></i></button>
            <span class="mini-label" style="color: var(--primary-green);">DISPONIBILIDAD EN VIVO</span>
            <h2 id="modal-nombre-interno" style="margin-bottom: 20px; color: #fff;">Elige un horario</h2>
            <div id="modal-disponibilidad"></div>
        </div>
    </div>

    <div id="modal-reserva" class="modal-oculto">
        <div class="modal-contenido center-modal" style="background:#111; border:1px solid var(--primary-green);">
            <button id="cerrar-reserva" class="btn-cerrar"><i class="ph-bold ph-x"></i></button>
            <h2 style="color: var(--primary-green); margin-top:0;"><i class="ph-fill ph-calendar-plus"></i> Tu Reserva</h2>
            <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:10px; margin-bottom:20px; border:1px solid rgba(255,255,255,0.1);">
                <p id="booking-cancha-nombre" style="margin:0 0 5px 0; color:#fff; font-weight:bold; font-size:1.1rem;"></p>
                <p id="booking-hora" style="margin:0; color:var(--primary-green); font-size:1.2rem; font-weight:900;"></p>
            </div>
            <div class="filter-field" style="margin-bottom:15px;"><span>Tu Nombre</span><input type="text" id="booking-nombre" placeholder="Ej. Juan Pérez" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2); border-radius:8px; color:#fff;"></div>
            <div class="filter-field" style="margin-bottom:20px;"><span>WhatsApp de contacto</span><input type="tel" id="booking-telefono" placeholder="Ej. 987654321" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.2); border-radius:8px; color:#fff;"></div>
            
            <button id="btn-confirmar-reserva" class="btn hero-primary" style="width:100%;"><i class="ph-bold ph-whatsapp-logo"></i> Confirmar por WhatsApp</button>
            <div id="booking-status"></div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
