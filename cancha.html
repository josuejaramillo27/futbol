<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info y Reseñas | APP FUTBOL</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark"><i class="ph-fill ph-soccer-ball"></i></span>
            <span>APP <b>FUTBOL</b></span>
        </div>
        <a href="index.html" class="btn btn-outline" style="width: auto; padding: 8px 15px;"><i class="ph-bold ph-arrow-left"></i> Volver</a>
    </header>

    <main style="max-width: 800px; margin: 0 auto;">
        
        <div id="court-info" class="card" style="text-align: center; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; gap: 15px;">
            <img id="court-logo" src="" alt="Logo" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-green); display: none;" onload="this.style.display='block'">
            
            <h2 id="court-title" style="margin: 0; font-size: 1.8rem;">Cargando Cancha...</h2>
            
            <p id="court-meta" style="color: var(--text-muted); font-size: 0.95rem; margin: 0; display: flex; gap: 10px; justify-content: center; align-items: center;"></p>
            
            <div id="court-rating" style="display: flex; flex-direction: column; align-items: center; margin-top: 10px; background: rgba(255,255,255,0.03); padding: 10px 20px; border-radius: 12px; border: 1px solid var(--border-color);">
                <i class="ph-bold ph-spinner-gap ph-spin"></i>
            </div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3 style="margin-bottom: 15px;">⭐ Opiniones de Jugadores</h3>
            
            <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                <button class="btn btn-outline filter-btn active" data-star="all" style="width: auto; padding: 6px 15px; font-size: 0.85rem;">Todas</button>
                <button class="btn btn-outline filter-btn" data-star="5" style="width: auto; padding: 6px 15px; font-size: 0.85rem;">5 <i class="ph-fill ph-star" style="color:var(--warning)"></i></button>
                <button class="btn btn-outline filter-btn" data-star="4" style="width: auto; padding: 6px 15px; font-size: 0.85rem;">4 <i class="ph-fill ph-star" style="color:var(--warning)"></i></button>
                <button class="btn btn-outline filter-btn" data-star="3" style="width: auto; padding: 6px 15px; font-size: 0.85rem;">3 <i class="ph-fill ph-star" style="color:var(--warning)"></i></button>
                <button class="btn btn-outline filter-btn" data-star="2" style="width: auto; padding: 6px 15px; font-size: 0.85rem;">2 <i class="ph-fill ph-star" style="color:var(--warning)"></i></button>
                <button class="btn btn-outline filter-btn" data-star="1" style="width: auto; padding: 6px 15px; font-size: 0.85rem;">1 <i class="ph-fill ph-star" style="color:var(--warning)"></i></button>
            </div>
            
            <div id="reviews-list">
                <div style="text-align:center; padding:30px; color:var(--text-muted);"><i class="ph-bold ph-spinner-gap ph-spin"></i> Cargando reseñas...</div>
            </div>
        </div>

    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
