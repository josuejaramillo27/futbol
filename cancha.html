<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info y Reseñas | APP FUTBOL</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1><i class="ph ph-soccer-ball"></i> APP FUTBOL</h1>
        <a href="index.html" class="btn btn-outline" style="width: auto; padding: 8px 15px;"><i class="ph-bold ph-arrow-left"></i> Volver al Inicio</a>
    </header>

    <main>
        <div class="card" style="text-align: center;">
            <h2 id="cancha-nombre">Cargando Cancha...</h2>
            <p style="color: var(--primary-green); font-weight: 800; font-size: 1.2rem; margin-top: 10px;" id="cancha-precio"></p>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3 style="margin-bottom: 15px;">⭐ Deja tu Reseña</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">Haz clic en las estrellas para calificar tu experiencia.</p>
            
            <div class="estrellas-container">
                <i class="ph ph-star" data-valor="1"></i>
                <i class="ph ph-star" data-valor="2"></i>
                <i class="ph ph-star" data-valor="3"></i>
                <i class="ph ph-star" data-valor="4"></i>
                <i class="ph ph-star" data-valor="5"></i>
            </div>
            
            <div id="tags-dinamicos" class="tags-container"></div>
            
            <button class="btn" id="btn-enviar-resena" style="display: none;">Enviar Calificación</button>
        </div>
    </main>
    <script type="module" src="app.js"></script>
</body>
</html>
