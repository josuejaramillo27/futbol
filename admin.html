<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | APP FUTBOL</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 id="nombre-cancha-admin">Mi Cancha Dashboard 📊</h1>
        <button id="btn-cerrar-sesion">Cerrar Sesión</button>
    </header>

    <main>
        <section class="card mt-2" id="configuracion-cancha">
    <h3>⚙️ Configura tu Mini-Sitio</h3>
    <p>Estos datos serán visibles para los jugadores al momento de reservar.</p>
    
    <form id="form-perfil-cancha">
        <label for="admin-nombre-cancha">Nombre Comercial de la Cancha:</label>
        <input type="text" id="admin-nombre-cancha" placeholder="Ej. El Maracaná Sintético" required>
        
        <label for="admin-precio">Precio por Hora (S/):</label>
        <input type="number" id="admin-precio" placeholder="Ej. 80" required>
        
        <label for="admin-servicios">Servicios Incluidos (Separados por coma):</label>
        <input type="text" id="admin-servicios" placeholder="Ej. Balón, Chalecos, Duchas, Parqueo" required>
        
        <button type="submit" class="btn">Guardar Cambios y Publicar</button>
    </form>
    <p id="mensaje-exito" style="color: var(--primary-green); display: none; margin-top: 10px;">¡Perfil actualizado exitosamente!</p>
</section>
        <section id="kpis" style="display: flex; gap: 20px;">
            <div>
                <h3>Ingresos Hoy</h3>
                <h2 id="ingresos-hoy">S/ 0.00</h2>
            </div>
            <div>
                <h3>Reservas Hoy</h3>
                <h2 id="reservas-hoy">0</h2>
            </div>
        </section>

        <section id="graficos" style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px;">
            <div style="width: 100%; max-width: 500px;">
                <h3>Ingresos (Día, Semana, Mes)</h3>
                <canvas id="graficoIngresos"></canvas> 
            </div>
            
            <div style="width: 100%; max-width: 500px;">
                <h3>Volumen de Reservas</h3>
                <canvas id="graficoReservas"></canvas>
            </div>
        </section>

        <section id="gestion-diaria">
            <h3>Logística de Hoy</h3>
            </section>
    </main>

    <script type="module" src="admin-dashboard.js"></script>
</body>
</html>
