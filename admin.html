<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | APP FUTBOL</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1 id="nombre-cancha-admin">Mi Cancha Dashboard 📊</h1>
        <button id="btn-cerrar-sesion">Cerrar Sesión</button>
    </header>

    <main>
        <section id="kpis" style="display: flex; gap: 20px;">
            <div>
                <h3>Ingresos Hoy</h3>
                <h2 id="ingresos-hoy">S/ 0.00</h2>
            </div>
            <div>
                <h3>Reservas Hoy</h3>
                <h2 id="reservas-hoy">0</h2>
            </div>
        </section>

        <section id="graficos" style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px;">
            <div style="width: 100%; max-width: 500px;">
                <h3>Ingresos (Día, Semana, Mes)</h3>
                <canvas id="graficoIngresos"></canvas> 
            </div>
            
            <div style="width: 100%; max-width: 500px;">
                <h3>Volumen de Reservas</h3>
                <canvas id="graficoReservas"></canvas>
            </div>
        </section>

        <section id="gestion-diaria">
            <h3>Logística de Hoy</h3>
            </section>
    </main>

    <script src="admin-dashboard.js"></script>
</body>
</html>
