<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | APP FUTBOL</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 id="nombre-cancha-admin">Mi Cancha Dashboard 📊</h1>
        <button id="btn-cerrar-sesion">Cerrar Sesión</button>
    </header>

    <main>
        <section class="card mt-2" id="configuracion-cancha">
    <h3>⚙️ Configura tu Mini-Sitio (Público)</h3>
    
    <form id="form-perfil-cancha">
        <label>Nombre de la Cancha:</label>
        <input type="text" id="admin-nombre" placeholder="Ej. El Maracaná Sintético" required>
        
        <label>Número de WhatsApp (Para reservas):</label>
        <input type="tel" id="admin-whatsapp" placeholder="Ej. 987654321" required>
        
        <label>Logo de tu negocio (Sube una imagen):</label>
        <input type="file" id="admin-logo" accept="image/*">

        <label>Descripción de tus servicios:</label>
        <textarea id="admin-descripcion" rows="3" placeholder="Contamos con pasto FIFA Quality, pelotas nuevas..."></textarea>

        <label>Precio por Hora (S/):</label>
        <input type="number" id="admin-precio" placeholder="Ej. 80" required>
        
        <label>Dirección exacta (Texto):</label>
        <input type="text" id="admin-ubicacion-texto" placeholder="Av. Los Pinos 123, Piura">
        
        <label>Link de Google Maps:</label>
        <input type="url" id="admin-ubicacion-link" placeholder="http://maps.google.com/...">

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;"><label>Apertura:</label><input type="time" id="admin-apertura" required></div>
            <div style="flex: 1;"><label>Cierre:</label><input type="time" id="admin-cierre" required></div>
        </div>

        <label>Galería de Fotos (Sube hasta 3 fotos de tu cancha):</label>
        <input type="file" id="admin-foto1" accept="image/*">
        <input type="file" id="admin-foto2" accept="image/*">
        <input type="file" id="admin-foto3" accept="image/*">

        <div class="btn-group">
            <button type="submit" id="btn-guardar-admin">Guardar y Publicar Configuración</button>
        </div>
    </form>
    <p id="mensaje-exito" style="color: var(--primary-green); display: none; margin-top: 10px;">¡Perfil actualizado exitosamente!</p>
</section>
        <section id="kpis" style="display: flex; gap: 20px;">
            <div>
                <h3>Ingresos Hoy</h3>
                <h2 id="ingresos-hoy">S/ 0.00</h2>
            </div>
            <div>
                <h3>Reservas Hoy</h3>
                <h2 id="reservas-hoy">0</h2>
            </div>
        </section>

        <section id="graficos" style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px;">
            <div style="width: 100%; max-width: 500px;">
                <h3>Ingresos (Día, Semana, Mes)</h3>
                <canvas id="graficoIngresos"></canvas> 
            </div>
            
            <div style="width: 100%; max-width: 500px;">
                <h3>Volumen de Reservas</h3>
                <canvas id="graficoReservas"></canvas>
            </div>
        </section>

        <section id="gestion-diaria">
            <h3>Logística de Hoy</h3>
            </section>
    </main>

    <script type="module" src="admin-dashboard.js"></script>
</body>
</html>
